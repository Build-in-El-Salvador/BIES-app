server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No request log here: the server's front nginx already logs every request
    # and rotates it after 14 days (privacy notice: "web server logs, 15 days").
    # A second copy in the container's output would be kept until the next deploy.
    access_log off;

    # ─── Use Docker's embedded DNS so upstreams are resolved at request time,
    #     not at config-load time. Prevents nginx from crash-looping when an
    #     upstream container is briefly down or recreating.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # ─── Allow file uploads up to 50 MB (matches Express multer limit) ─────
    client_max_body_size 50m;

    # ─── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ─── Static asset caching (Vite hashed filenames) ────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── NIP-05 identity verification ─────────────────────────────────────────
    location /.well-known/nostr.json {
        set $bies_server "bies-server";
        proxy_pass http://$bies_server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "max-age=300";
    }

    # ─── iOS: links to shared pages open in the app, and the app may use ─────
    #     passwords saved for this domain (ios/App/App/SavedKeyPlugin.swift).
    #     No extension, so the type is set here; Apple's CDN wants JSON.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    # ─── Photo and video uploads ─────────────────────────────────────────────
    #     A video is made smaller before the answer comes back
    #     (server/src/services/mediaProcessing.ts): a minute or more when a
    #     few arrive at once, so longer than the usual 60 seconds. Uploads keep
    #     the server's 50 MB limit; the rest of the API takes 1 MB.
    location = /api/upload/deck {
        set $bies_server "bies-server";
        proxy_pass http://$bies_server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /api/upload/media {
        set $bies_server "bies-server";
        proxy_pass http://$bies_server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ─── API proxy → backend server ──────────────────────────────────────────
    #     Bodies are small JSON (the server takes up to 1 MB); files go through
    #     the upload locations above.
    location /api/ {
        client_max_body_size 1m;
        set $bies_server "bies-server";
        proxy_pass http://$bies_server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket proxy ─────────────────────────────────────────────────────
    location /ws {
        set $bies_server "bies-server";
        proxy_pass http://$bies_server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ─── Nostr relay WebSocket proxy ──────────────────────────────────────────
    location /relay {
        set $bies_auth_proxy "bies-auth-proxy";
        proxy_pass http://$bies_auth_proxy:7778;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Use $http_host (preserves port) so the auth proxy can reconstruct
        # the exact relay URL the client used for NIP-42 relay tag validation.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Forward the original X-Forwarded-Proto from the outer TLS nginx
        # so the auth proxy knows to use wss:// for relay URL validation.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400;
    }

    # ─── Upload files (served directly from shared volume) ────────────────────
    # Members' photos and videos only (storage.service.ts names them
    # milliseconds-hex.ext); nothing else in the volume is served, private/
    # included. The headers keep a file to what its extension says. A
    # location with add_header doesn't inherit the server's, so they're
    # repeated here.
    location ~* "^/uploads/public/[0-9]{13}-[0-9a-f]{32}\.(jpe?g|png|gif|webp|mp4|m4v|mov|webm)$" {
        root /app;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri @uploads_backend;
    }
    location /uploads/ {
        return 404;
    }

    # Fallback to backend if file not found on disk
    location @uploads_backend {
        set $bies_server "bies-server";
        proxy_pass http://$bies_server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Bugs tracker: switched off (2026-10-13) ───────────────────────────────
    # Cam's bug tracker (bugs/) isn't in use, ran unpinned CDN scripts on the
    # app's own domain, and its API had no sign-in. Off until it's back on its
    # own subdomain behind a login.
    location /bugs {
        return 404;
    }

    # ─── LibreTranslate proxy ─────────────────────────────────────────────────
    location /translate/ {
        set $bies_translate "bies-translate";
        proxy_pass http://$bies_translate:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── OG meta tags for social media crawlers on event pages ──────────────
    location ~ ^/events/[^/]+$ {
        if ($http_user_agent ~* "(WhatsApp|facebookexternalhit|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot|Googlebot|bingbot)") {
            rewrite ^/events/(.+)$ /api/events/$1/og last;
        }
        try_files $uri /index.html;
    }

    # ─── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
