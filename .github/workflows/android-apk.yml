# Builds an installable Android APK on GitHub's runners every time main moves
# and keeps the newest one on a rolling "latest" pre-release, so community
# testers can sideload the app without Google Play:
#
#   https://github.com/Build-in-El-Salvador/BIES-app/releases/download/latest/BIES.apk
#
# This is the TESTER build, not the Play build. Play takes a signed .aab made
# by android/ship.sh with the upload key, which stays in ~/.bies-android on
# the maintainer's machine. This workflow signs with a separate CI key held in
# repository secrets, so a leak of the CI key can never touch the Play upload
# key. The two keys differ, so a CI APK cannot update a Play-installed app (or
# the other way round) — testers uninstall before switching channels.
#
# Why a secret key and not a debug key committed to the repo: a public key
# would let anyone build an APK that Android accepts as an update to a
# tester's install, and that app holds the member's Nostr key.
#
# Secrets (Settings > Secrets and variables > Actions), set once. The key
# alias is fixed below; the key password equals the store password, as PKCS12
# requires.
#   ANDROID_CI_KEYSTORE_B64   base64 -w0 of the CI keystore (.p12/.jks)
#   ANDROID_CI_KEYSTORE_PASS  its password
#
# Pull requests that touch this file run the same release build with no
# secrets, signed with a throwaway key made on the runner, so the toolchain
# and the signature check are proven before the change reaches main. Only the
# key and the publish step differ between a pull request and main.

name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/android-apk.yml

# One build at a time on main, queued rather than cancelled, so the release
# below is never replaced half-way by a newer run.
concurrency:
  group: android-apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Production URLs baked into the native bundle (see docs/ANDROID.md). Public
  # by nature; without them every API call resolves against https://localhost.
  VITE_API_URL: https://app.buildinelsalvador.com/api
  VITE_NOSTR_RELAY: wss://app.buildinelsalvador.com/relay

jobs:
  apk:
    name: Build APK
    # Pinned, not ubuntu-latest: that label is migrating to Ubuntu 26, and a
    # signing job should not change its Android SDK or JDK underneath us.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      # SHA-256 of the signing certificate, for the release notes. Public.
      cert_sha256: ${{ steps.verify.outputs.cert_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # .nvmrc
          cache: npm
      # Capacitor 8 / AGP 8.13 need JDK 21 (docs/ANDROID.md).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci
      - name: Native web bundle + cap sync
        run: npx vite build --mode native && npx cap sync android

      # Same guard as android/ship.sh: a bundle without the production URL
      # would install fine and fail every request.
      - name: Check the bundle carries the production API URL
        run: grep -rqF "$VITE_API_URL" android/app/src/main/assets/public/assets

      # CI builds get their own version: versionCode counts runs so a newer
      # build always installs over an older one, versionName names the commit.
      # Edited on the runner only; nothing is committed.
      - name: Stamp version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          f=android/app/build.gradle
          sed -i -E "s/^([[:space:]]*versionCode )[0-9]+\$/\1${RUN_NUMBER}/" "$f"
          sed -i -E "s/^([[:space:]]*versionName )\"[^\"]*\"\$/\1\"1.0-ci.${RUN_NUMBER}.${SHA:0:7}\"/" "$f"
          grep -qE "^[[:space:]]*versionCode ${RUN_NUMBER}\$" "$f"
          grep -qE "^[[:space:]]*versionName \"1.0-ci.${RUN_NUMBER}.${SHA:0:7}\"\$" "$f"

      # app/build.gradle reads ~/.bies-android/keystore.properties when present,
      # so signing needs no Gradle change. The secrets exist only in this one
      # step's environment, after npm's install scripts have already run.
      - name: Write the CI signing key
        if: github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_CI_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ANDROID_CI_KEYSTORE_PASS }}
        run: |
          for v in KEYSTORE_B64 STORE_PASS; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is not set — see the header of this file"; exit 1; }
          done
          d="$HOME/.bies-android"
          install -d -m 700 "$d"
          printf '%s' "$KEYSTORE_B64" | base64 -d | install -m 600 /dev/stdin "$d/ci.keystore"
          {
            echo "storeFile=$d/ci.keystore"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=bies-ci"
            echo "keyPassword=$STORE_PASS"
          } | install -m 600 /dev/stdin "$d/keystore.properties"

      # Pull requests have no secrets, but they still sign, with a key made
      # here and discarded with the runner. That way the signing wiring and
      # the apksigner check below run on every PR, not for the first time on
      # main. An APK from this step is never published.
      - name: Throwaway signing key (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          d="$HOME/.bies-android"
          install -d -m 700 "$d"
          PASS=$(openssl rand -hex 16)
          export PASS
          keytool -genkeypair -storetype PKCS12 -keystore "$d/ci.keystore" -alias bies-ci \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=BIES PR throwaway" \
            -storepass:env PASS -keypass:env PASS
          chmod 600 "$d/ci.keystore"
          {
            echo "storeFile=$d/ci.keystore"
            echo "storePassword=$PASS"
            echo "keyAlias=bies-ci"
            echo "keyPassword=$PASS"
          } | install -m 600 /dev/stdin "$d/keystore.properties"

      - name: Gradle build
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Locate, verify and name the APK
        id: verify
        env:
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -n1)
          [ -n "$apk" ] || { echo "::error::no APK produced"; exit 1; }
          # A fixed name keeps the public download link the same for ever.
          mkdir -p out
          cp "$apk" out/BIES.apk
          # The APK must verify. apksigner exits non-zero on an unsigned or
          # tampered APK, which stops the job before anything is published.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          cert=$("$apksigner" verify --print-certs "$apk")
          # Whatever the label before it ("Signer #1", or a "Signer (minSdk...)"
          # form on newer build-tools) and whether the digest is plain or
          # colon-separated hex, reduce it to 64 lowercase hex characters.
          sha256=$(grep -m1 -iE 'certificate SHA-256 digest:' <<<"$cert" | sed -E 's/.*digest: *//' | tr -d ': ' | tr 'A-F' 'a-f')
          if ! [[ $sha256 =~ ^[0-9a-f]{64}$ ]]; then
            # Certificate details are public, so showing them is safe and makes
            # a format change visible in the annotation, not just in the log.
            echo "::error::could not read the signing certificate digest; apksigner printed: $(head -c 800 <<<"$cert" | tr '\n' '|')"
            exit 1
          fi
          echo "cert_sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### BIES APK \`${SHA:0:7}\`"
            echo
            if [ "$EVENT" = push ]; then
              echo "Signing certificate SHA-256: \`$sha256\`"
            else
              echo "Pull request build, signed with a throwaway key: \`$sha256\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: BIES-apk
          path: out/BIES.apk
          if-no-files-found: error
          retention-days: 30

  # Publishing needs write access to releases, so it is its own job: the build
  # job above, which holds the signing key, never gets contents: write.
  publish:
    name: Publish rolling release
    needs: apk
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BIES-apk
          path: out
      - name: Replace the "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CERT_SHA256: ${{ needs.apk.outputs.cert_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release delete latest --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create latest out/BIES.apk --repo "$REPO" \
            --target "$SHA" --prerelease \
            --title "Test build (main ${SHA:0:7})" --notes-file - <<EOF
          Test build of \`main\` at \`${SHA:0:7}\`, for installing outside Google Play.

          1. Download \`BIES.apk\` below on your Android phone.
          2. Open it. Android asks to let your browser or file manager install unknown apps; allow that once.
          3. Later builds install over this one. A copy from Google Play, if you have one, uses a different key: uninstall it first.

          Signing certificate SHA-256 (check it matches before you trust a copy from anywhere else):
          \`$CERT_SHA256\`

          Build log: $RUN_URL
          EOF
