<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- maximum-scale=1 suppresses iOS Safari's auto-zoom on sub-16px inputs
       (which breaks the fixed navbar layout); iOS ignores it for user
       pinch-zoom since iOS 10, so accessibility zoom still works. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0047ab" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Open Graph defaults (overridden by server for /events/:id crawlers) -->
  <meta property="og:title" content="BIES | Build in El Salvador" />
  <meta property="og:description" content="Bitcoin-native investment ecosystem connecting builders and investors in El Salvador" />
  <meta property="og:image" content="/icons/icon-512.png" />

  <title>BIES | Build in El Salvador</title>
</head>

<body style="margin:0;background:#0A192F;">
  <div id="root">
    <!-- Splash screen shown while JS loads — React replaces this -->
    <div id="splash" style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#0A192F;z-index:999999;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="120" height="120">
        <path fill="#ff5b00" d="M539.97,0C241.73,0-.03,241.76-.03,540s241.76,540,540,540,540.07-241.76,540.07-540S838.2,0,539.97,0ZM539.97,998.16c-252.99,0-458.17-205.11-458.17-458.17S286.98,81.83,539.97,81.83s458.17,205.11,458.17,458.17-205.11,458.17-458.17,458.17Z"/>
        <path fill="#f9f5f4" d="M362.5,219.18h196.15c118.32,0,165.17,61.15,165.17,159.62v15.87c0,72.27-30.17,108.8-77.82,127.86,52.41,19.06,87.35,62.74,87.35,142.14v15.88c0,120.7-46.06,180.27-169.15,180.27h-201.71V219.18ZM546.74,481.25c38.91,0,62.74-11.92,62.74-63.53v-42.89c0-50.82-19.85-61.14-61.95-61.14h-73.06v167.56h72.26ZM550.7,766.33c52.41,0,67.5-15.08,67.5-69.09v-51.62c0-50.82-19.85-69.88-67.5-69.88h-76.23v190.59h76.23Z"/>
      </svg>
    </div>
  </div>
  <script>
    // Capture fatal JS errors that prevent React from mounting.
    // window.onerror masks cross-origin module errors to a bare "Script error."
    // with no file/line — but the real Error object (e.error) usually still
    // carries the true name/message/stack, so surface that when available.
    function __biesShowBootError(label, detail) {
      var s = document.getElementById('splash');
      if (!s || s._errShown) return;
      s._errShown = true;
      var d = document.createElement('div');
      d.style.cssText = 'margin-top:2rem;padding:1rem;text-align:left;color:#ff6b6b;font:12px/1.45 monospace;max-width:92vw;white-space:pre-wrap;word-break:break-word;overflow:auto;max-height:60vh';
      d.textContent = label + ': ' + detail;
      s.appendChild(d);
    }
    window.addEventListener('error', function (e) {
      var detail;
      if (e.error) {
        detail = (e.error.name || 'Error') + ': ' + (e.error.message || String(e.error));
        if (e.error.stack) detail += '\n' + String(e.error.stack).split('\n').slice(0, 4).join('\n');
      } else {
        detail = (e.message || 'Unknown') + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')';
      }
      __biesShowBootError('Boot error', detail);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      var detail = r ? ((r.name ? r.name + ': ' : '') + (r.message || String(r))) : 'unknown';
      if (r && r.stack) detail += '\n' + String(r.stack).split('\n').slice(0, 4).join('\n');
      __biesShowBootError('Unhandled promise rejection', detail);
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Splash-screen watchdog: if React hasn't replaced #splash within 8s,
    // show a reload prompt so the user isn't stuck on a blank logo forever.
    (function () {
      var t = setTimeout(function () {
        var s = document.getElementById('splash');
        if (s) {
          var d = document.createElement('div');
          d.style.cssText = 'margin-top:2rem;text-align:center;color:rgba(255,255,255,0.7);font:14px system-ui,sans-serif';
          d.innerHTML = '<p>Taking longer than expected\u2026</p>'
            + '<button type="button" style="margin-top:0.75rem;padding:0.5rem 1.5rem;background:#FF5B00;color:#fff;border:none;border-radius:8px;font-size:0.9rem;cursor:pointer">Reload</button>';
          // A listener, not onclick="": the page's CSP runs no inline handlers.
          d.querySelector('button').addEventListener('click', function () { location.reload(); });
          s.appendChild(d);
        }
      }, 8000);
      // Cancel the watchdog once React mounts (splash div gets removed)
      var obs = new MutationObserver(function () {
        if (!document.getElementById('splash')) { clearTimeout(t); obs.disconnect(); }
      });
      obs.observe(document.getElementById('root'), { childList: true });
    })();

    // Skip service-worker registration inside the Capacitor native shell:
    // WKWebView has no Service Worker support, and the native app relies on
    // bundled assets (offline) + native push instead of sw.js.
    var isCapacitorNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    if ('serviceWorker' in navigator && !isCapacitorNative) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          reg.update();
        }).catch(() => {});
      });
    }
  </script>
</body>

</html>
